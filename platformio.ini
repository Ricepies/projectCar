; PlatformIO Project Configuration File
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = pico
description = 4WD Robot Car controller for Raspberry Pi Pico with PS2 Gamepad

[env:pico]
platform = raspberrypi
board = pico
framework = arduino
build_flags = -Wall
lib_deps = 
	ivanseidel/ArduinoThread@^2.1.1
	sstaub/TickTwo@^4.4.0

[env:mhetesp32devkit]
platform = espressif32
board = mhetesp32devkit
framework = arduino
lib_deps = 
	ivanseidel/ArduinoThread@^2.1.1
	sstaub/TickTwo@^4.4.0
